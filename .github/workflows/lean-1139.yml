name: Lean (1139)

on:
  push:
    paths:
      - "1139/lean/**"
      - ".github/workflows/lean-1139.yml"
  pull_request:
    paths:
      - "1139/lean/**"
      - ".github/workflows/lean-1139.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: 1139/lean
    steps:
      - uses: actions/checkout@v4

      - name: Forbid sorry / admit / native_decide / axiom in the Lean files
        run: |
          FILES="LongGapsBetweenPrimes.lean Erdos1139Cover.lean Erdos1139Sketch.lean Erdos1139Official.lean"
          status=0
          for f in $FILES; do
            test -f "$f" || { echo "::error::missing $f"; status=1; continue; }
            # Erdos1139Sketch.lean says "`sorry`-free" in its module docstring; allow only that.
            if grep -nwE 'sorry|admit|native_decide' "$f" | grep -v '`sorry`-free'; then
              echo "::error::forbidden keyword in $f"; status=1
            fi
            if grep -nE '^\s*axiom\s' "$f"; then
              echo "::error::axiom declaration in $f"; status=1
            fi
          done
          exit $status

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Check axioms of the verified theorems
        run: |
          cat > /tmp/Axioms.lean <<'EOF'
          import Erdos1139Official
          #print axioms LongGapsBetweenPrimes.short_translates
          #print axioms LongGapsBetweenPrimes.short_translates_divisor
          #print axioms LongGapsBetweenPrimes.short_translates_divisor_with_sieveDelta
          #print axioms Erdos1139Cover.eventually_cover_residues
          #print axioms Erdos1139Sketch.erdos_1139
          #print axioms Erdos1139.erdos_1139
          EOF
          lake env lean /tmp/Axioms.lean | tee /tmp/axioms.txt
          # Every theorem must depend on exactly the three standard axioms.
          tr -d ' \n' < /tmp/axioms.txt | grep -o "dependsonaxioms:\[[^]]*\]" > /tmp/deps.txt
          cat /tmp/deps.txt
          test "$(wc -l < /tmp/deps.txt)" -eq 6 || { echo "::error::expected 6 axiom reports"; exit 1; }
          if grep -v -x 'dependsonaxioms:\[propext,Classical.choice,Quot.sound\]' /tmp/deps.txt; then
            echo "::error::non-standard axioms"; exit 1
          fi
